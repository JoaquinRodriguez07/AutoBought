<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ titulo }}</title>
</head>
<body style="margin:0; padding:0; background:#f3f4f6; font-family:Arial, Helvetica, sans-serif; color:#1f2937;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f4f6; padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px; background:#ffffff; border-radius:8px; overflow:hidden;">
          <tr>
            <td style="background:#111827; padding:20px 24px;">
              <span style="font-size:22px; font-weight:900; color:#ffffff;">Auto<span style="color:#f97316;">Bought</span></span>
            </td>
          </tr>
          <tr>
            <td style="padding:28px 24px; font-size:15px; line-height:1.6;">
              <h1 style="margin:0 0 16px; font-size:20px;">{{ titulo }}</h1>
              {% block contenido %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:16px 24px; background:#f9fafb; font-size:12px; color:#6b7280;">
              Este mail lo envió AutoBought automáticamente. No respondas a esta dirección.
              {% if enlace_baja %}<br>¿No querés recibir más ofertas ni recordatorios? <a href="{{ enlace_baja }}" style="color:#6b7280;">No quiero recibir estos mails</a>.{% endif %}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
