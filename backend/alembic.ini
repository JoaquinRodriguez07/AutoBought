# Configuración de Alembic (migraciones de la base). Se corre desde backend/:
#   uv run alembic upgrade head
#
# La conexión NO va acá: migrations/env.py usa DATABASE_URL, la misma
# variable (y el mismo engine, app/db/session.py) que usa el backend.

[alembic]
script_location = %(here)s/migrations
# Nombres de archivo ordenados: 0001_baseline.py, 0002_..., etc.
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
