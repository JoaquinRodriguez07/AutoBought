# Análisis de SonarQube Cloud (SCRUM-165). Lo corre el job "sonar" de ci.yml.
# Sonar no ejecuta los tests: lee los reportes de cobertura que generan
# pytest-cov y Jest en los jobs "backend" y "frontend".
sonar.organization=joaquinrodriguez07
sonar.projectKey=JoaquinRodriguez07_AutoBought
sonar.projectName=AutoBought

sonar.python.version=3.14
sonar.sourceEncoding=UTF-8

# Los tests del backend viven en tests/ (raíz). Los del frontend están junto
# al código, así que frontend/src figura en los dos lados: sonar.exclusions los
# saca de "sources" y sonar.test.inclusions los deja en "tests". Las dos listas
# tienen que coincidir o Sonar falla por indexar un archivo dos veces.
sonar.sources=backend/app,frontend/src
sonar.tests=tests,frontend/src
sonar.exclusions=frontend/src/**/*.test.*,frontend/src/setupTests.js,frontend/src/testAssetMock.js,frontend/src/testTokens.js,frontend/src/dashboard/testGrafico.js
sonar.test.inclusions=tests/**,frontend/src/**/*.test.*,frontend/src/setupTests.js,frontend/src/testAssetMock.js,frontend/src/testTokens.js,frontend/src/dashboard/testGrafico.js

# main.jsx tampoco se mide en jest.config.cjs (collectCoverageFrom).
sonar.coverage.exclusions=frontend/src/main.jsx

sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
