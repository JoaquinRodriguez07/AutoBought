<text class="s" x="523" y="646">TCP 5432 · Internet</text>

<text class="s" x="40" y="788">Navegador → contenedores: HTTP a localhost:&lt;puerto&gt;. backend → postgres: TCP 5432 por la red de compose.</text>
<text class="s" x="40" y="804">Punteado: perfiles de compose, volumen, y .env / código montados en los contenedores (bind mount).</text>
