<text class="s" x="523" y="718">TCP 5432 · Internet</text>

<text class="s" x="40" y="860">Navegador → contenedores: HTTP a localhost:&lt;puerto&gt;. backend → postgres y mailpit: por la red de compose.</text>
<text class="s" x="40" y="876">Punteado: perfiles de compose, volumen, y .env / código montados en los contenedores (bind mount).</text>
<text class="s" x="40" y="892">Mercado Pago (credenciales de prueba) y Gemini se usan por Internet si el .env tiene sus claves.</text>
</svg>
