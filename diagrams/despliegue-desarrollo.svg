.at{fill:#085041}
.dash{fill:none;stroke:#5f5e5a;stroke-dasharray:5 4}
.path{fill:none;stroke:#444441;stroke-width:1.2}
</style>
<rect width="680" height="810" fill="#ffffff"/>

<!-- Nodos -->
<rect class="node" x="40" y="52" width="600" height="528"/><polygon class="face" points="40,52 52,40 652,40 640,52"/><polygon class="face" points="640,52 652,40 652,568 640,580"/>
<rect class="node" x="236" y="620" width="388" height="144"/><polygon class="face" points="236,620 248,608 636,608 624,620"/><polygon class="face" points="624,620 636,608 636,752 624,764"/>

<!-- Entornos de ejecución -->
<rect class="env" x="56" y="220" width="160" height="312"/><polygon class="envf" points="56,220 64,212 224,212 216,220"/><polygon class="envf" points="216,220 224,212 224,524 216,532"/>
<rect class="env" x="236" y="140" width="388" height="420"/><polygon class="envf" points="236,140 244,132 632,132 624,140"/><polygon class="envf" points="624,140 632,132 632,552 624,560"/>
<rect class="env" x="252" y="676" width="356" height="74"/><polygon class="envf" points="252,676 260,668 616,668 608,676"/><polygon class="envf" points="608,676 616,668 616,742 608,750"/>

<!-- Perfiles de compose -->
<rect class="dash" x="250" y="192" width="360" height="168"/>
<rect class="dash" x="250" y="376" width="176" height="168"/>

<!-- PC del desarrollador -->
<text class="s" x="56" y="72">«device»</text><text class="t" x="56" y="90">PC del desarrollador</text>
<rect class="art" x="330" y="66" width="120" height="44" rx="2"/><text class="s c at" x="390" y="80">«artifact»</text><text class="t c at" x="390" y="98">.env</text>
<rect class="art" x="466" y="66" width="150" height="44" rx="2"/><text class="s c at" x="541" y="80">«artifact»</text><text class="t c at" x="541" y="98">Código fuente</text>
<text class="s m" x="136" y="240">«executionEnvironment»</text><text class="t m" x="136" y="258">Navegador web</text>
<text class="s" x="250" y="158">«executionEnvironment»</text><text class="t" x="250" y="176">Docker Engine · docker compose</text>

<!-- Perfil local -->
<text class="s" x="262" y="210">perfil local</text>
<rect class="art" x="262" y="220" width="150" height="56" rx="2"/><text class="s c at" x="337" y="234">«container»</text><text class="t c at" x="337" y="250">frontend</text><text class="s c at" x="337" y="266">Vite dev · :5173</text>
<rect class="dash" x="446" y="220" width="150" height="56"/><text class="s c" x="521" y="240">«volume»</text><text class="t c" x="521" y="258">postgres_data</text>
<rect class="art" x="262" y="292" width="150" height="56" rx="2"/><text class="s c at" x="337" y="306">«container»</text><text class="t c at" x="337" y="322">backend</text><text class="s c at" x="337" y="338">fastapi dev · :8000</text>
<rect class="art" x="446" y="292" width="150" height="56" rx="2"/><text class="s c at" x="521" y="306">«container»</text><text class="t c at" x="521" y="322">postgres</text><text class="s c at" x="521" y="338">postgres:17 · :5432</text>

<!-- Perfil remoto -->
<text class="s" x="262" y="394">perfil remoto</text>
<rect class="art" x="262" y="404" width="150" height="56" rx="2"/><text class="s c at" x="337" y="418">«container»</text><text class="t c at" x="337" y="434">frontend-remote</text><text class="s c at" x="337" y="450">Vite dev · :5174</text>
<rect class="art" x="262" y="476" width="150" height="56" rx="2"/><text class="s c at" x="337" y="490">«container»</text><text class="t c at" x="337" y="506">backend-remote</text><text class="s c at" x="337" y="522">fastapi dev · :8001</text>

<!-- VM Oracle Cloud -->
<text class="s" x="252" y="640">«device»</text><text class="t" x="252" y="656">VM Oracle Cloud (OCI)</text>
<text class="s" x="266" y="704">«executionEnvironment»</text><text class="t" x="266" y="722">Docker Engine</text>
<rect class="art" x="430" y="688" width="170" height="50" rx="2"/><text class="s c at" x="515" y="704">«container» postgres:17</text><text class="t c at" x="515" y="722">PostgreSQL</text>

