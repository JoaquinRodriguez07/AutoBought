# Integración continua de AutoBought.
# Corre en cada PR hacia dev o main y en cada push a dev.
# Los nombres de los jobs ("backend" y "frontend") son los que se eligen
# como "status checks" obligatorios en los rulesets de GitHub.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

# Si se sube un commit nuevo al mismo PR, se cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Postgres de prueba para tests/migrations_test.py (migraciones, UNIQUE de
    # part_code, seeds en paralelo). Vive y muere con la corrida.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-not-a-real-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Valores solo para CI: los tests usan SQLite en memoria (tests/conftest.py).
      SECRET_KEY: ci-only-not-a-real-secret
      DATABASE_URL: sqlite://
      TEST_POSTGRES_URL: postgresql+psycopg2://postgres:ci-only-not-a-real-password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Instalar Python 3.14
        run: uv python install 3.14

      - name: Instalar dependencias (falla si uv.lock no coincide con pyproject.toml)
        run: uv sync --locked --group dev

      - name: Tests + cobertura (mínimo 70%)
        run: uv run pytest --cov-fail-under=70

      - name: Guardar cobertura para Sonar
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-backend
          path: backend/coverage.xml
          if-no-files-found: error

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Instalar Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias (falla si package-lock.json está desincronizado)
        run: npm ci

      - name: Lint (oxlint)
        run: npx oxlint

      - name: Build
        run: npm run build

      # Sin --passWithNoTests: si Jest no encuentra tests (por ejemplo, porque
      # se movieron o se renombraron), el job falla en lugar de pasar en verde.
      - name: Tests unitarios (Jest)
        run: npm test

      - name: Guardar cobertura para Sonar
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-frontend
          path: frontend/coverage/lcov.info
          if-no-files-found: error

  # Corre después de los tests porque necesita sus reportes de cobertura.
  sonar:
    name: sonar
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      # Las PRs de Dependabot y de forks no reciben secrets: sin token se
      # saltea el análisis en lugar de marcar el job en rojo.
      - name: Avisar si no hay token
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::Sin SONAR_TOKEN, se saltea el análisis de Sonar."

      # Sonar usa la historia completa para saber qué código es nuevo.
      - uses: actions/checkout@v7
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0

      - name: Bajar cobertura del backend
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v8
        with:
          name: cobertura-backend
          path: backend

      - name: Bajar cobertura del frontend
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v8
        with:
          name: cobertura-frontend
          path: frontend/coverage

      # Los reportes salen con rutas relativas a backend/app y a frontend/, y
      # Sonar trabaja desde la raíz del repo. Si no coinciden, el análisis pasa
      # igual pero muestra 0% de cobertura.
      - name: Ajustar rutas de cobertura a la raíz del repo
        if: env.SONAR_TOKEN != ''
        run: |
          sed -i -e "s#<source>.*</source>#<source>$GITHUB_WORKSPACE</source>#" -e 's#filename="#filename="backend/app/#' backend/coverage.xml
          sed -i 's#^SF:#SF:frontend/#' frontend/coverage/lcov.info

      - name: Análisis de SonarQube Cloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
